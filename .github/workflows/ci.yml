name: ci

# Actions are pinned to the *oldest* major that runs on Node 24 (Node 20 is
# deprecated on the hosted runners). Every later major of these three is an
# unrelated behaviour change, not another runtime bump:
#
#   checkout      v5 = node24. v6 moves persisted credentials to a separate
#                 file; v7 rewrites to ESM and blocks fork-PR checkout under
#                 pull_request_target / workflow_run.
#   setup-python  v6 = node24. v7 rewrites to ESM, removes the pip-install
#                 input and drops EOL Python versions from its manifest.
#   cache         v5 = node24. v6 ships no release notes at all.
#
# All three need actions-runner >= 2.327.1; the hosted ubuntu-latest runner is
# far past that (2.337.0 as of the last run) and this repo has no self-hosted
# runners. Bumping past these majors is a separate decision with its own
# verification, not part of clearing the Node 20 warning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hermes_ref:
        # Manual escape hatch for the `current` leg, so an arbitrary host tag or
        # commit can still be tested on demand (the old compat.yml's hermes_ref
        # input). The `floor` leg is always the pinned tag below.
        description: "Override the current-host leg's Hermes ref (default: v2026.9.24)"
        required: false
        type: string

jobs:
  zulip-bridge:
    runs-on: ubuntu-latest
    # Feeds the README's test-count badge (see the `badges` job below).
    outputs:
      tests_passed: ${{ steps.tests.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (3.11)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check adapter.py
        run: python -m py_compile zulip/adapter.py

      - name: Syntax check __init__.py
        run: python -m py_compile zulip/__init__.py

      - name: Validate plugin.yaml
        run: python -c "import yaml; yaml.safe_load(open('zulip/plugin.yaml'))"

      - name: Verify checksums.txt is current
        run: |
          # checksums.txt backs the self-updater's integrity check: updater.py
          # verifies downloaded files against the copy in the repo, so a stale
          # entry makes `zulip update` abort with a checksum mismatch for every
          # user. Regenerate exactly as .githooks/pre-push does and diff.
          #
          # LC_ALL=C pins glob collation so this comparison cannot drift with
          # the runner's locale: the package has a collation-sensitive pair
          # (inbound.py vs inbound_queue.py - "." sorts before "_" bytewise,
          # but after it under e.g. en_US.UTF-8).
          export LC_ALL=C
          for f in zulip/*.py zulip/*.sh zulip/plugin.yaml zulip/__init__.py; do
            [ -f "$f" ] && echo "$(sha256sum "$f" | cut -d" " -f1)  ${f#zulip/}"
          done > /tmp/checksums.expected
          if ! diff -u checksums.txt /tmp/checksums.expected; then
            echo "::error::checksums.txt is out of date. Regenerate it (see .githooks/pre-push) and commit the result."
            exit 1
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (3.12)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (3.12)
        id: tests
        run: |
          # pipefail so a failing suite still fails the step: without it the
          # pipeline's exit status is tee's, not pytest's.
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest.log
          # "===== 1471 passed in 58.99s =====" -> 1471. Publish the count from
          # the run that just happened rather than a number kept by hand.
          count="$(grep -oE '[0-9]+ passed' /tmp/pytest.log | tail -1 | grep -oE '^[0-9]+')"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "tests passed: ${count}"

      - name: Enforce pristine working directory
        run: |
          git diff --exit-code || {
            echo "Working directory is not clean. Generated files might be out of sync."
            false
          }

  compat:
    # Real-host compatibility gate (#141).
    #
    # This runs here, behind `needs: zulip-bridge`, rather than in its own
    # workflow — the same shape the OpenClaw sibling uses. `tests/stubs/` can
    # never notice that a real gateway lacks a symbol, so this job installs an
    # actual Hermes host and asserts every gateway symbol, registration kwarg and
    # behavioural contract the plugin depends on. It is *not* in the fast lane:
    # `needs:` means the cheap checks decide first, and a red py_compile or
    # pytest run never pays for two host installs. The fast lane itself is not
    # slowed — its steps are unchanged and it still reports as soon as it is done.
    #
    # Two things the previous separate `compat.yml` got wrong, both fixed here:
    #
    # 1. It read the host ref from `HERMES_COMPAT_REF` (repo variable or secret).
    #    Nothing ever set it, so the weekly cron died in the *first* step with a
    #    configuration error and never reached the host install. Every leg's ref
    #    is pinned in this file instead: there is no variable to forget, and a
    #    missing ref is not a possible failure mode.
    # 2. It installed the host with
    #    `pip install "hermes-agent @ git+https://...@${ref}"`, which cannot work
    #    against any current host: Hermes's build backend refuses a wheel or
    #    sdist build from a source tree ("Building wheels or sdists for
    #    hermes-agent is not supported. Hermes is distributed via the shell
    #    installer, Docker image, or Nix."). Setting the variable alone would
    #    therefore have moved the failure one step later, not fixed it. The
    #    install is editable now, which is the one form the backend supports.
    needs: zulip-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every leg even if one fails: a cancelled sibling hides whether the
      # other hosts regressed.
      fail-fast: false
      matrix:
        # floor   - the *declared* floor, zulip/version.py::__min_hermes__, on the
        #           host that claim names. Taken from PyPI as a wheel, so this
        #           leg is seconds. This is the leg that makes the floor claim
        #           load-bearing in both directions (see the last step).
        # gated   - the version the exec-approval symbols appear in, which
        #           AGENTS.md and SECURITY.md both name as >= 0.21.3. Not on
        #           PyPI, so it comes from git by tag.
        # current - the newest host release.
        leg: [floor, gated, current]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve host ref
        id: host
        env:
          INPUT_REF: ${{ inputs.hermes_ref }}
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            floor)   ref="0.18.2";                  source="pypi" ;;
            gated)   ref="v2026.9.14";              source="git"  ;;  # host 0.21.3
            current) ref="${INPUT_REF:-v2026.9.24}"; source="git"  ;;  # host 0.21.5
            *) echo "::error::unknown leg '${LEG}'"; exit 1 ;;
          esac
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "Testing Hermes ${source} ref: ${ref} (leg=${LEG})"

      - name: Cache pip (host dependency tree)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          # Keyed on the leg and host ref, with no restore-keys: a partial key
          # match could restore wheels cached for a different host ref, and the
          # host's dependency tree changes between refs. A miss just re-downloads.
          key: pip-hermes-${{ matrix.leg }}-${{ steps.host.outputs.ref }}

      - name: Install pinned Hermes host (editable)
        env:
          # Escape hatch for a host that is not on the default upstream (e.g. a
          # private host repo). Unset is fine: it defaults, and the job still
          # needs no configuration.
          HERMES_COMPAT_REPO: ${{ vars.HERMES_COMPAT_REPO || 'NousResearch/hermes-agent' }}
          HERMES_REF: ${{ steps.host.outputs.ref }}
          HERMES_SOURCE: ${{ steps.host.outputs.source }}
        run: |
          python -m pip install --upgrade pip
          if [ "$HERMES_SOURCE" = "pypi" ]; then
            # The floor is published as a wheel, so no git clone and no build.
            pip install "hermes-agent==${HERMES_REF}"
          else
            # Editable is not a style choice: a plain PEP 508 direct reference
            # (`pip install "hermes-agent @ git+..."`) fails to build against a
            # current host, because the backend supports only an editable build
            # from a source tree. --src keeps the clone out of the checkout so
            # the workspace stays clean.
            pip install -e \
              "git+https://github.com/${HERMES_COMPAT_REPO}@${HERMES_REF}#egg=hermes-agent" \
              --src "$RUNNER_TEMP/host-src"
          fi

      - name: Run real-host compatibility gate
        # Prints the detected host version, each gated capability, and exits
        # non-zero with an actionable message naming the missing gateway symbol
        # when the host is present but incompatible.
        run: python scripts/check_compat.py

      - name: Assert the declared floor is enforced
        # Only on the floor leg, and only after the gate above has passed: a
        # floor that nothing asserts is exactly how __min_hermes__ read 0.18.2
        # while the harness rejected every host below 0.21.3 (#230). Prove the
        # new check on a host *below* the floor rather than trusting it to not
        # be dead code.
        if: matrix.leg == 'floor'
        run: |
          python -m pip install "hermes-agent==0.18.1" >/dev/null
          set +e
          python scripts/check_compat.py > /tmp/below-floor.log 2>&1
          status=$?
          set -e
          cat /tmp/below-floor.log
          if [ "$status" -ne 1 ]; then
            echo "::error::check_compat exited ${status} for host 0.18.1, which is below the declared floor __min_hermes__=0.18.2. The floor is not being enforced."
            exit 1
          fi
          if ! grep -q "below the declared floor" /tmp/below-floor.log; then
            echo "::error::0.18.1 was rejected for some other reason; the floor check did not fire."
            exit 1
          fi
          echo "floor enforced: 0.18.1 rejected, 0.18.2 accepted"

  badges:
    # Publishes the README's test-count badge from the suite that just ran, so the
    # number cannot go stale the way a hand-maintained shields.io `tests-<N>`
    # badge did (it read 1168 while the suite ran 1471).
    #
    # The data lives on its own `badges` branch rather than on main: the
    # Production Safeguard ruleset covers `refs/heads/main` (its ref_name
    # condition includes only that ref), so main is not writable from CI, and a
    # published count is not something a contributor should have to update in a
    # PR. The README reads it from
    # https://raw.githubusercontent.com/<repo>/badges/tests.json
    #
    # Main only: a pull request from a fork gets a read-only token and could not
    # push, so running it there would only produce a red check for contributors.
    needs: zulip-bridge
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Publish the test count
        env:
          COUNT: ${{ needs.zulip-bridge.outputs.tests_passed }}
        run: |
          set -euo pipefail
          if [ -z "${COUNT}" ]; then
            echo "::error::the fast job reported no test count; refusing to publish a badge that says nothing."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges 2>/dev/null; then
            git checkout -B badges FETCH_HEAD
          else
            # First run, or the branch was deleted: start it clean so it holds
            # the badge data and nothing else.
            git checkout --orphan badges
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          fi
          printf '{"schemaVersion":1,"label":"tests","message":"%s passing","color":"brightgreen"}\n' \
            "$COUNT" > tests.json
          if [ -z "$(git status --porcelain tests.json)" ]; then
            echo "badge already reports ${COUNT} passing; nothing to push"
            exit 0
          fi
          git add tests.json
          git commit -m "badge: tests ${COUNT} passing"
          git push origin badges
          echo "published: tests ${COUNT} passing"
