name: parity

# Validates docs/parity-matrix.yaml and reports the sister-only / hermes-only
# delta between this repo and the openclaw-zulip-bridge sibling. This is a
# *visibility* gate: drift is printed but does not fail the job. Only a schema
# error (a malformed matrix) is non-zero. See docs/PARITY.md (issue #140).
#
# Deliberately separate from ci.yml, which the #141 contract-gates work owns.

on:
  push:
    branches: [main]
    paths:
      - "docs/parity-matrix.yaml"
      - "docs/PARITY.md"
      - "scripts/parity_check.py"
      - ".github/workflows/parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/parity-matrix.yaml"
      - "docs/PARITY.md"
      - "scripts/parity_check.py"
      - ".github/workflows/parity.yml"
  schedule:
    # Weekly, so drift in the sibling surfaces even when nothing here changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Self-test the parity checker
        run: python scripts/parity_check.py --self-test

      - name: Validate matrix and report drift
        run: python scripts/parity_check.py
