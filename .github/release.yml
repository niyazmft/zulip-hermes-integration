# Configuration for GitHub's automatically generated release notes.
#
# The release body has a short, scannable top (summary, highlights, scale line)
# and the exhaustive record behind <details> blocks:
#   1. the on-page part and the collapsed curated notes  (scripts/release_notes.py)
#   2. this generated layer, collapsed: "What's Changed" + "New Contributors"
#      + the "Full Changelog" compare link
#
# `scripts/release_notes.py` fetches this layer with
# `gh api repos/{repo}/releases/generate-notes` — not `gh release create
# --generate-notes`, which would append it uncollapsed after the body — so this
# file is still what shapes the categories and the exclusions below.
#
# This layer is what credits contributors mechanically. "What's Changed" lists
# every merged PR author in the range — maintainer included — and
# "New Contributors" highlights first-timers; the script renders those authors
# as the on-page **Thanks** line. That is why CHANGELOG.md does not need a
# hand-maintained Contributors list in the release body (see docs/RELEASING.md).
#
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    # The release PR only bumps the version and moves the CHANGELOG entry, so it
    # must not appear in its own release. docs/RELEASING.md labels it `release`.
    labels:
      - release
      - ignore-for-release
    # Dependency bumps would otherwise add noise to "What's Changed".
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    # PRs are sparse with labels today, so most entries land in "Other Changes".
    # The collapsed curated notes carry the real Added/Fixed/Docs/Internal
    # structure; these categories only shape the mechanical list.
    - title: Added
      labels:
        - enhancement
        - feature
    - title: Fixed
      labels:
        - bug
    - title: Docs
      labels:
        - documentation
    - title: Internal
      labels:
        - ci-cd
        - infrastructure
    - title: Other Changes
      labels:
        - "*"
