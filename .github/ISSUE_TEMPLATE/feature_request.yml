name: Feature Request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!

        This adapter has a TypeScript sibling,
        [openclaw-zulip-bridge](https://github.com/niyazmft/openclaw-zulip-bridge). If a feature
        exists there and not here, say so — cross-runtime parity is tracked deliberately.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: input
    id: parity
    attributes:
      label: Does the OpenClaw sibling already do this?
      description: If yes, a link to the file or PR there saves a lot of time.
      placeholder: https://github.com/niyazmft/openclaw-zulip-bridge/...

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or examples about the feature request here.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have read the README and [AGENTS.md](https://github.com/niyazmft/zulip-hermes-integration/blob/main/AGENTS.md) and this is not already configurable
          required: true
        - label: I have searched existing issues and discussions to avoid duplicates
          required: true
