name: zulip
label: Zulip
kind: platform
version: 1.12.0
description: Zulip gateway adapter for Hermes Agent. Supports streams with topics and private messages.
author: Niyaz
requires_env:
  - name: ZULIP_API_KEY
    description: "Bot API key from Zulip Settings → Bots"
    prompt: "Zulip bot API key"
    url: "https://zulipchat.com/help/add-a-bot"
    password: true
  - name: ZULIP_EMAIL
    description: "Bot email address (e.g. hermes-bot@your-org.zulipchat.com)"
    prompt: "Zulip bot email"
  - name: ZULIP_SITE
    description: "Zulip organization URL (e.g. https://your-org.zulipchat.com)"
    prompt: "Zulip site URL"
optional_env:
  - name: ZULIP_PROFILE
    description: 'Named default posture. "recommended" turns on the shared-teammate defaults (mention-gated streams, DM allowlist seeded from the Zulip bot owner, activity trace, on-demand history, observation, per-session queue, per-topic sessions, reaction triggers) without editing any other setting. An explicit ZULIP_* value always wins; unset means unchanged legacy behaviour (default: none)'
    prompt: "Profile (recommended | leave empty)"
  - name: ZULIP_ALLOWED_USERS
    description: "Comma-separated emails allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
  - name: ZULIP_OWNER_EMAIL
    description: "The bot owner's Zulip email. Under ZULIP_PROFILE=recommended this is discovered from Zulip automatically; set it when the bot is organisation-owned, when auto-detection is wrong, or when no one can DM the bot (default: empty)"
    prompt: "Owner email (usually auto-detected)"
  - name: ZULIP_REACTIONS_ENABLED
    description: "Enable emoji reaction status indicators (default: true)"
    prompt: "Enable reactions"
  - name: ZULIP_REACTION_CLEAR_ON_FINISH
    description: "Remove 'working' reaction when done (default: true)"
    prompt: "Clear reactions on finish"
  - name: ZULIP_REACTION_START
    description: "Emoji while processing (default: eyes)"
    prompt: "Start reaction emoji"
  - name: ZULIP_REACTION_SUCCESS
    description: "Emoji on success (default: check_mark)"
    prompt: "Success reaction emoji"
  - name: ZULIP_REACTION_ERROR
    description: "Emoji on error (default: warning)"
    prompt: "Error reaction emoji"
  - name: ZULIP_REACTION_TRIGGERS
    description: 'JSON object mapping emoji name to an instruction, e.g. {"+1": "Proceed with the proposed step."}. A reaction on the bot''s own stream message dispatches that instruction as a turn in the same topic (default: none — off)'
    prompt: "Reaction triggers (JSON)"
  - name: ZULIP_REACTION_TRIGGER_ANY_MESSAGE
    description: "Allow reaction triggers on messages the bot did not author (default: false — only the bot's own messages)"
    prompt: "Allow reaction triggers on any message"
  - name: ZULIP_TEXT_CHUNK_LIMIT
    description: "Max chars per outbound message (default: 10000)"
    prompt: "Text chunk limit"
  - name: ZULIP_CHUNK_MODE
    description: 'Chunking mode: "length" or "newline" (default: length)'
    prompt: "Chunk mode"
  - name: ZULIP_MEDIA_MAX_MB
    description: "Max inbound attachment size in MB (default: 5)"
    prompt: "Media max size (MB)"
  - name: ZULIP_CHATMODE
    description: 'Stream trigger mode: "onmessage", "oncall", "onchar" (default: onmessage)'
    prompt: "Chat mode"
  - name: ZULIP_ONCHAR_PREFIXES
    description: 'Trigger prefixes for onchar mode (default: >,!)'
    prompt: "Onchar prefixes"
  - name: ZULIP_CONNECT_TIMEOUT
    description: "Max seconds for connection validation calls (default: 30)"
    prompt: "Connect timeout (seconds)"
  - name: ZULIP_READ_TIMEOUT
    description: "Max seconds for read/get Zulip API calls (default: 60)"
    prompt: "Read timeout (seconds)"
  - name: ZULIP_SEND_TIMEOUT
    description: "Max seconds for send/write Zulip API calls (default: 90)"
    prompt: "Send timeout (seconds)"
  - name: ZULIP_STREAMS
    description: 'Comma-separated stream names to monitor (default: * for all)'
    prompt: "Streams to monitor"
  - name: ZULIP_BLOCK_SECRET_LEAKS
    description: "Refuse to send messages containing host credential values (default: true)"
    prompt: "Block outbound secret leaks"
  - name: ZULIP_ALLOW_INSECURE_HTTP
    description: "Allow an http:// (or private-host) ZULIP_SITE, where the API key is sent unencrypted. Default false"
    prompt: "Allow insecure http (trusted self-hosted only)"
  - name: ZULIP_ACTIVITY_TRACE
    description: "Post one status message per request and edit it in place while the agent works (default: false)"
    prompt: "Show an activity trace"
  - name: ZULIP_TRACE_COALESCE_MS
    description: "Coalesce trace edits over this window in ms (default: 400)"
    prompt: "Trace coalesce window (ms)"
  - name: ZULIP_TRACE_MAX_RATE
    description: "Hard ceiling on trace edits per second (default: 2)"
    prompt: "Trace edits per second"
  - name: ZULIP_TRACE_MAX_CONTENT
    description: "Maximum characters in a trace message before older steps are trimmed (default: 3500)"
    prompt: "Trace max content"
  - name: ZULIP_TRACE_TOOL_MATCHER
    description: "Which finished tool calls become trace checkpoints: comma-separated names form an allowlist, `!name` excludes (default: all tools)"
    prompt: "Trace tool filter"
  - name: ZULIP_RESPONSE_PREFIX
    description: 'Prefix prepended to every outbound message (default: empty)'
    prompt: "Response prefix"
  - name: ZULIP_GROUP_POLICY
    description: 'Who can send stream messages: open, allowlist, disabled (default: open)'
    prompt: "Group policy"
  - name: ZULIP_GROUP_ALLOW_FROM
    description: "Comma-separated emails allowed in streams (for allowlist mode)"
    prompt: "Group allowlist"
  - name: ZULIP_REQUIRE_MENTION
    description: "Require @mention in streams (default: true)"
    prompt: "Require mention"
  - name: ZULIP_ENGAGEMENT_MODE
    description: 'Sticky follow-ups after @mention: "off" (default) or "sticky_topic"'
    prompt: "Engagement mode"
  - name: ZULIP_ENGAGEMENT_SCOPE
    description: 'Who can continue without @mention: "user" (default, same person) or "topic" (anyone in topic)'
    prompt: "Engagement scope"
  - name: ZULIP_ENGAGEMENT_TTL_MINUTES
    description: "Minutes of idle time before sticky engagement expires (default: 45)"
    prompt: "Engagement TTL minutes"
  - name: ZULIP_ENGAGEMENT_EXPIRY_NOTICE
    description: "Post a topic notice when sticky engagement idle-expires (default: true)"
    prompt: "Engagement expiry notice"
  - name: ZULIP_ENGAGEMENT_EXPIRY_SCAN_SECONDS
    description: "How often to scan for expired engagements (default: 30)"
    prompt: "Expiry scan interval seconds"
  - name: ZULIP_TOPIC_SESSIONS
    description: "Give each stream topic its own conversation session (default: false)"
    prompt: "Per-topic sessions"
  - name: ZULIP_APPROVAL_ON_TIMEOUT
    description: 'What an unanswered exec approval means: "allow" (default, today''s behaviour) or "deny" (fail closed — the bot says in the topic that the request was refused and records the timeout). The gateway owns the approval timeout and refuses an unanswered request either way; this key decides what the install promises about silence. The recommended profile sets "deny".'
    prompt: "Unanswered exec approvals"
  - name: ZULIP_APPROVAL_AUTHORITY
    description: 'Who may decide an exec approval: "anyone" (default, today''s behaviour — anyone who can see the prompt) or "owner" (only the bot owner, resolved from Zulip or ZULIP_OWNER_EMAIL; a decision from anyone else is refused and the prompt stays open for the owner). When "owner" is set and no owner can be resolved, nobody may decide. The recommended profile sets "owner".'
    prompt: "Who may approve exec requests"
  - name: ZULIP_STREAM_OVERRIDES
    description: 'Per-stream chatmode overrides as a JSON object, e.g. {"bot lab": {"chatmode": "onmessage"}}'
    prompt: "Per-stream chatmode overrides (JSON)"
  - name: ZULIP_DM_POLICY
    description: 'Who can DM the bot: open, allowlist, disabled (default: open)'
    prompt: "DM policy"
  - name: ZULIP_ALLOW_ALL_USERS
    description: "Skip the allowed-users check and accept any Zulip user (default: false)"
    prompt: "Allow all users"
  - name: ZULIP_HOME_CHANNEL
    description: "Default stream id for cron `deliver: zulip` targets (e.g. 573423)"
    prompt: "Default cron stream id"
  - name: ZULIP_MAX_MESSAGE_LENGTH
    description: "Hard cap on a single outbound message in characters, 0 disables (default: 20000)"
    prompt: "Max outbound message length"
  - name: ZULIP_MAX_MESSAGES_PER_MINUTE
    description: "Maximum outbound messages per minute (default: 60)"
    prompt: "Max messages per minute"
  - name: ZULIP_DM_SESSION_TURN_LIMIT
    description: "Rotate the DM session every N turns to limit context growth, 0 disables (default: 20)"
    prompt: "DM session turn limit"
  - name: ZULIP_TYPING_DELAY_SECONDS
    description: "Legacy typing-indicator duration in seconds; typing is now owned by the gateway keep-typing loop"
    prompt: "Typing delay (seconds)"
  - name: HERMES_MEDIA_ALLOW_DIRS
    description: "Extra directories the gateway may read inbound media from (os.pathsep- or comma-separated absolute paths)"
    prompt: "Media allow dirs"
  - name: ZULIP_SOFT_GATE
    description: "Dispatch every monitored stream message like onmessage, tagging event metadata with addressed=true/false, so the bot watches a stream without replying to all of it (default: false)"
    prompt: "Dispatch all stream messages (soft gate)"
  - name: ZULIP_OBSERVE_GROUP
    description: "Record non-addressed stream messages as bounded per-topic context without replying; the buffer is quoted into the prompt when the bot is next addressed in that topic (default: false)"
    prompt: "Observe stream messages without replying"
  - name: ZULIP_SESSION_QUEUE
    description: "Queue a message that arrives while its topic (or DM) is mid-run behind the running turn instead of steering it into that turn, so one person cannot redirect another's work; separate topics still run in parallel (default: false)"
    prompt: "Per-session message queue"
  - name: ZULIP_QUEUE_CAP
    description: "How many turns may wait behind one running session before a new message is dispatched immediately instead of being dropped (default: 20)"
    prompt: "Session queue cap"
  - name: ZULIP_HISTORY_MODE
    description: 'Quote real stream/topic history into the prompt: "off", "on-demand" (only for history questions), or "always" (default: off)'
    prompt: "History context mode"
  - name: ZULIP_HISTORY_MAX_MESSAGES
    description: "Maximum history messages quoted per turn (default: 8)"
    prompt: "Max history messages"
  - name: ZULIP_HISTORY_WINDOW_HOURS
    description: "How far back topic history is harvested, in hours (default: 72)"
    prompt: "History window (hours)"
  - name: ZULIP_HISTORY_MAX_CHARS
    description: "Maximum characters in the quoted history block (default: 4000)"
    prompt: "Max history characters"
