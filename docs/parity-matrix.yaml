# Parity matrix: zulip-hermes-integration (Python) <-> openclaw-zulip-bridge (TypeScript).
#
# Machine-readable source of truth. The prose spec and the rendered table live in
# docs/PARITY.md; scripts/parity_check.py validates this file and prints the
# sister-only / hermes-only delta. See "keyed off merge state on main" below.
#
# Status is keyed off *merge state on `main`*, never releases. On both sides a
# feature can be merged and unreleased (the sibling's v2026.9.1 pre-release notes
# described work that was not in that tag), so "released" is not a safe proxy:
#
#   both         merged on `main` in both repos
#   sister-only  merged on `main` in openclaw-zulip-bridge (or a tracked fork),
#                not yet merged here
#   hermes-only  merged on `main` here, not verified on `main` in the sibling
#
# Update the status the moment a parity item lands (or is verified), not at
# release time. Keep the rendered table in docs/PARITY.md in sync.

spec_version: "0.1.0"
keyed_off: merge-state-on-main
hermes_repo: zulip-hermes-integration
sister_repo: openclaw-zulip-bridge
statuses: [both, sister-only, hermes-only]
last_reviewed: "2026-09-30"

# Capability matrix ------------------------------------------------------------
# `refs.hermes` / `refs.sister` point at the issue or file that proves the
# capability is on `main` on that side.
capabilities:
  - id: message-length-cap
    title: Outbound message-length cap and chunking
    status: both
    refs:
      hermes: "zulip/adapter.py#_resolve_max_message_length"
      sister: "src/config-schema.ts#maxMessageLength"
    notes: "Ported from the sibling in 1.9.1 (#126)."

  - id: relative-upload-resolution
    title: Relative markdown upload paths resolved against the realm base URL
    status: both
    refs:
      hermes: "#126"
      sister: "src/zulip/uploads.ts"
    notes: "Ported from the sibling in 1.9.1 (#126)."

  - id: secret-guard
    title: Outbound secret guard — refuse to transmit host credential values
    status: both
    refs:
      hermes: "#136"
      sister: "src/zulip/secret-guard.ts"
    notes: "Sibling shipped first; landed here in #171."

  - id: https-policy
    title: HTTPS required for ZULIP_SITE, with an explicit insecure-http opt-in
    status: both
    refs:
      hermes: "#137"
      sister: "src/config-schema.ts#allowInsecureHttp"
    notes: "Landed here in #172 (zulip/probe.py)."

  - id: upload-denylist
    title: Upload denylist for credential / config / audit / session files
    status: both
    refs:
      hermes: "#138"
      sister: "src/zulip/uploads.ts"
    notes: "Landed here in #172 (zulip/media.py)."

  - id: activity-trace
    title: Progressive activity trace — one status message per request, edited in place
    status: both
    refs:
      hermes: "#139"
      sister: "src/zulip/activity-trace.ts"
    notes: "Landed here across #173/#174/#175/#176."

  - id: dedupe-store
    title: Persistent dedupe store (TTL + LRU, debounced atomic save)
    status: both
    refs:
      hermes: "zulip/dedupe_store.py"
      sister: "src/zulip/dedupe-store.ts"
    notes: "Identical defaults: 5 min TTL, 2000 entries, 5000 ms save debounce."

  - id: audit-logger
    title: Rotating JSON-lines audit log for security-relevant events
    status: both
    refs:
      hermes: "zulip/audit_logger.py"
      sister: "src/zulip/audit-logger.ts"
    notes: "Same rotation policy (1 MB / 3 files) but the event shape drifted — see PARITY.md §5.5."

  - id: traffic-policy
    title: DM / group / chatmode traffic policy
    status: both
    refs:
      hermes: "zulip/policy.py"
      sister: "src/zulip/policy.ts"

  - id: reactions
    title: Emoji reaction status indicators (start / success / error / clear)
    status: both
    refs:
      hermes: "zulip/reactions.py"
      sister: "src/zulip/reactions.ts"

  - id: rate-limiting
    title: Per-sender sliding-window rate limit
    status: both
    refs:
      hermes: "zulip/rate_limiter.py"
      sister: "src/zulip/audit-logger.ts#rate_limit_exceeded"
    notes: "maxMessagesPerMinute knob on both sides."

  - id: group-dm-recipients
    title: Group DM replies reach every recipient, not just the sender
    status: hermes-only
    refs:
      hermes: "#154"
    notes: >-
      Landed here in #169 from a fork; sibling parity is not yet verified.
      Reclassify to `both` only after a sibling-side check.

