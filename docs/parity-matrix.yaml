# Config keys -----------------------------------------------------------------
# Every ZULIP_* knob read by this plugin, plus the sibling-only keys we do not
# implement. `derivable` is true when `sibling_key` is exactly what the naming
# rule in PARITY.md §5.2 produces from `env`; false means the pair is an
# exception that the rule cannot reproduce and must be carried explicitly.
config:
  # --- required -------------------------------------------------------------
  - env: ZULIP_API_KEY
    sibling_key: apiKey
    derivable: true
    status: both
  - env: ZULIP_EMAIL
    sibling_key: email
    derivable: true
    status: both
  - env: ZULIP_SITE
    sibling_key: site
    derivable: true
    status: both
    notes: "The sibling also accepts `url` and `realm` aliases."

  # --- access control -------------------------------------------------------
  - env: ZULIP_ALLOWED_USERS
    sibling_key: allowFrom
    derivable: false
    status: both
    notes: "Named `allowFrom` in the sibling; the rule cannot derive it."
  - env: ZULIP_DM_POLICY
    sibling_key: dmPolicy
    derivable: true
    status: both
  - env: ZULIP_GROUP_POLICY
    sibling_key: groupPolicy
    derivable: true
    status: both
  - env: ZULIP_GROUP_ALLOW_FROM
    sibling_key: groupAllowFrom
    derivable: true
    status: both

  # --- behavior -------------------------------------------------------------
  - env: ZULIP_REACTIONS_ENABLED
    sibling_key: reactions.enabled
    derivable: false
    status: both
    notes: "Sibling nests reaction knobs under `reactions`."
